<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lucky para PC</title><style>body{font:14px system-ui;width:310px;padding:14px;background:#111827;color:#f9fafb}h1{font-size:18px;margin:0 0 8px}p{color:#cbd5e1;line-height:1.4}input{box-sizing:border-box;width:100%;padding:9px;margin:5px 0 9px;border-radius:7px;border:1px solid #475569;background:#0f172a;color:white}button{width:100%;padding:10px;margin:3px 0;border:0;border-radius:8px;background:#60a5fa;color:#111827;font-weight:700;cursor:pointer}#status{white-space:pre-wrap;margin-top:10px;font-size:12px}</style></head><body><h1>Lucky para PC</h1><p>Configure o token local uma vez. A página ativa só será lida quando você clicar em enviar. Senhas e campos de formulário não são coletados.</p><label for="token">Token da ponte local</label><input id="token" type="password" autocomplete="off"><button id="save">Salvar token neste navegador</button><button id="send">Enviar página ao Lucky</button><div id="status" role="status"></div><script src="popup.js"></script></body></html>
